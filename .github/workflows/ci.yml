name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite takes seconds. A test file that leaves a server or timer open
    # never exits, and would otherwise hold the job for GitHub's 6 hours.
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # Zero runtime dependencies: the suite runs on node:test alone. On Node
      # 22 it runs with Node's own npm, as publish.yml's test job does.
      - run: npm test
      # Then, on Node 22, the package tests again with the publish job's npm,
      # so the test of its publishConfig check reads tarballs with the pacote
      # a release stages with. test/package.test.mjs pins this job, and checks
      # on that run that the npm beside node is that version.
      - if: matrix.node == 22
        run: npm install -g --ignore-scripts npm@11.21.0
      - if: matrix.node == 22
        run: node --test test/package.test.mjs
        env:
          CI_EXPECTS_PUBLISH_NPM: "true"

  # The Docker Provisioner's internal network on a real runtime (#32):
  # Docker Engine, and Podman through its Docker-compatible socket with the
  # docker CLI pointed at it. The test runs only when asked (QA_DOCKER_IT),
  # fails rather than skips when asked and no runtime answers, and the last
  # step fails the job on any skip.
  docker-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - if: matrix.runtime == 'podman'
        run: |
          sudo systemctl stop docker.socket docker.service
          sudo systemctl start podman.socket
          sudo chmod a+x /run/podman
          sudo chmod a+rw /run/podman/podman.sock
      - run: docker version
        env:
          DOCKER_HOST: ${{ matrix.runtime == 'podman' && 'unix:///run/podman/podman.sock' || '' }}
      - run: node --test --test-force-exit --test-reporter=spec test/integration/docker-internal.test.mjs | tee it.log
        shell: bash
        env:
          QA_DOCKER_IT: "1"
          DOCKER_HOST: ${{ matrix.runtime == 'podman' && 'unix:///run/podman/podman.sock' || '' }}
          DOCKER_BUILDKIT: ${{ matrix.runtime == 'podman' && '0' || '1' }}
      - run: grep -qx 'ℹ skipped 0' it.log

  # The README's sandbox-exec profile on macOS 14 and 15 (#32): the docs test
  # runs it through sandbox-exec. QA_REQUIRE_SANDBOX makes the test fail
  # rather than skip where sandbox-exec can't run (none, or nested), and the
  # last step fails the job on any skip.
  macos-sandbox:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: sw_vers
      - run: node --test --test-force-exit --test-reporter=spec test/docs.test.mjs | tee sbx.log
        shell: bash
        env:
          QA_REQUIRE_SANDBOX: "1"
          QA_SANDBOX_ROUNDS: "30"
      - run: grep -q "sandbox-exec profile shuts the ports it names" sbx.log && grep -qx 'ℹ skipped 0' sbx.log
