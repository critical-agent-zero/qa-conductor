name: publish

# A pushed v<version> tag stages that version on npm. Nothing goes live until a
# maintainer approves the staged version on npmjs.com. NPM_TOKEN is a
# stage-only token for @critical-labs, so a plain publish would be refused.
#
# Two jobs, so the token never meets the repository's code:
# - test checks that the tagged commit was main itself, checks the tag, runs
#   the tests and packs the tarball, with no secrets and no id-token;
# - publish waits for a maintainer to approve the npm-release environment,
#   checks the commit again, and stages test's tarball. It checks out nothing
#   and runs no code from the repository.
# A tag runs the workflow file of the commit it names, so these checks catch
# mistakes. What holds against an edited file is the approval, and NPM_TOKEN
# living in the npm-release environment alone.
# test/package.test.mjs pins the shape of this file.

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # The publish job's check, run first here too, before any checkout: a
      # tag on a commit main never was fails before anyone is asked to approve
      # it, and the approver sees this check pass.
      - name: Check the tagged commit is on main, before the approval
        run: |
          git init --quiet "$RUNNER_TEMP/main-history"
          cd "$RUNNER_TEMP/main-history"
          git fetch --quiet --no-tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main: tag a commit main has merged"
            exit 1
          fi
          git rev-list --first-parent refs/remotes/origin/main > "$RUNNER_TEMP/main-first-parent"
          if ! grep -qxF "$GITHUB_SHA" "$RUNNER_TEMP/main-first-parent"; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) was merged into main but never was main: tag main's merge commit"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # A release must not restore a cache another run could have written.
          package-manager-cache: false
      # The tag names the release, package.json is what gets packed: refuse a
      # tag that would stage some other version under its name.
      - name: Check the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version (want v$version)"
            exit 1
          fi
      - run: npm test
      # Packs the tarball the publish job stages, and lists what it holds.
      - run: npm pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball
          path: critical-labs-qa-conductor-*.tgz
          if-no-files-found: error
          # As long as a deployment can wait for its approval.
          retention-days: 30

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A maintainer approves each run. The environment admits v* tags only.
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      # Only a commit that was main itself may be released, as a release's
      # merge commit was: a v* tag on any other commit stops here. That
      # includes a branch's or a pull request's own commit, even once main
      # has merged it, since its tree is not one main ever had. Git alone, in
      # a directory of its own: main's history, and no files from the tag.
      # The first-parent list goes through a file: under pipefail, grep -q
      # quitting early would fail the pipe.
      - name: Check the tagged commit is on main
        run: |
          git init --quiet "$RUNNER_TEMP/main-history"
          cd "$RUNNER_TEMP/main-history"
          git fetch --quiet --no-tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main: tag a commit main has merged"
            exit 1
          fi
          git rev-list --first-parent refs/remotes/origin/main > "$RUNNER_TEMP/main-first-parent"
          if ! grep -qxF "$GITHUB_SHA" "$RUNNER_TEMP/main-first-parent"; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) was merged into main but never was main: tag main's merge commit"
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Staged publishing needs Node >= 22.14 and npm >= 11.15.
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # This job holds the token, so one npm, by exact version, and none of its
      # install scripts.
      - run: npm install -g --ignore-scripts npm@11.21.0
      # The tarball the test job packed from the commit it tested,
      # digest-checked on download.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball
          path: release
      - name: Check the tarball is the tag's version
        run: |
          want="critical-labs-qa-conductor-${GITHUB_REF_NAME#v}.tgz"
          have="$(ls -A release)"
          if [ "$have" != "$want" ]; then
            echo "::error::the test job's tarball is $have, not $want"
            exit 1
          fi
      # The ./ makes it a file: npm would read release/<name>.tgz as a GitHub
      # repository. --registry, because a tarball's publishConfig.registry
      # would outrank setup-node's. No npm script runs for a tarball.
      - name: Stage publish (a maintainer approves on npmjs.com to go live)
        run: npm stage publish "./release/critical-labs-qa-conductor-${GITHUB_REF_NAME#v}.tgz" --access public --registry https://registry.npmjs.org/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
